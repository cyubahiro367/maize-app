services:
  db:
    image: postgres:16-alpine
    container_name: maize_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maize_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maize_pass}
      POSTGRES_DB: ${POSTGRES_DB:-maize_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maize_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: maize_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-maize_user}:${POSTGRES_PASSWORD:-maize_pass}@db:5432/${POSTGRES_DB:-maize_db}
      MODEL_PATH: /app/model
      CONFIDENCE_THRESHOLD: "0.60"
    volumes:
      - ./backend/app:/app/app
      - ./ml/exported_model:/app/model
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: maize_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
